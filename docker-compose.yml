# Dev stack. Everything runs on `aperture-internal` (internal: true => no route out, not even
# to the Docker host). Prerequisite images come from bootstrap/ (see bootstrap/images.lock).
#
#   docker compose up -d --build              db -> loader (one-shot) -> backend, mcp-server, tiles -> frontend
#   open http://localhost:8080                 the edge (nginx) is the only published port
#   docker compose run --rm probe <url>       curl from inside the internal network
#   docker compose --profile test up -d db-test   fixtures DB for pytest on 127.0.0.1:55432
name: aperture

x-db: &db
  image: timescale/timescaledb-ha:pg17@sha256:3e3440ab4c2aa585e743b1d8466cda9bbf18b6c598ec7806cf61e02fa5cd1d1a
  # TimescaleDB phones home by default; telemetry off keeps the DB silent even off-network.
  command: ["postgres", "-c", "timescaledb.telemetry_level=off"]
  environment:
    POSTGRES_USER: aperture
    POSTGRES_PASSWORD: aperture
    POSTGRES_DB: aperture
  shm_size: 1g
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U aperture -d aperture -h 127.0.0.1"]
    interval: 5s
    timeout: 5s
    retries: 60

x-db-init: &db-init
  # Mounted file-by-file: the image ships its own init scripts in the same directory.
  - ./db/init/100_extensions.sql:/docker-entrypoint-initdb.d/100_extensions.sql:ro
  - ./db/init/110_schema.sql:/docker-entrypoint-initdb.d/110_schema.sql:ro

x-build: &build
  context: .
  network: none
  args:
    PY_DEPS: aperture/py-deps:latest

networks:
  internal:
    name: aperture-internal
    internal: true
  test:
    name: aperture-test
  # Ordinary bridge: only llm-relay joins it, to reach LM Studio on the Docker host.
  llm-egress:
    name: aperture-llm-egress
  # Carries only the published port (127.0.0.1:8080 -> frontend). Docker cannot publish ports
  # from an internal network, so the edge has a route out; Gate 3 proves nginx never uses it
  # (config audit: internal upstreams only, no resolver; socket table after the e2e run).
  edge:
    name: aperture-edge

volumes:
  pgdata:

services:
  db:
    <<: *db
    volumes:
      - pgdata:/home/postgres/pgdata
      - ./db/init/100_extensions.sql:/docker-entrypoint-initdb.d/100_extensions.sql:ro
      - ./db/init/110_schema.sql:/docker-entrypoint-initdb.d/110_schema.sql:ro
    networks: [internal]

  loader:
    build:
      <<: *build
      dockerfile: db/loader/Dockerfile
    image: aperture/loader:dev
    environment:
      DATABASE_URL: postgresql://aperture:aperture@db:5432/aperture
    depends_on:
      db: { condition: service_healthy }
    networks: [internal]
    restart: "no"

  backend:
    build:
      <<: *build
      dockerfile: backend/Dockerfile
    image: aperture/backend:dev
    environment:
      DATABASE_URL: postgresql://aperture:aperture@db:5432/aperture
      LLM_BASE_URL: http://llm-relay:1234/v1
      LLM_MODEL: qwen/qwen3.5-9b
    depends_on:
      db: { condition: service_healthy }
      loader: { condition: service_completed_successfully }
      llm-relay: { condition: service_started }
    networks: [internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30

  # MCP adapter over the same tool registry: streamable HTTP at http://mcp-server:8001/mcp.
  mcp-server:
    build:
      <<: *build
      dockerfile: mcp-server/Dockerfile
    image: aperture/mcp-server:dev
    environment:
      DATABASE_URL: postgresql://aperture:aperture@db:5432/aperture
      # Host headers accepted (DNS-rebinding guard): direct, and via the edge from host or network.
      MCP_ALLOWED_HOSTS: localhost:*,127.0.0.1:*,mcp-server:*,frontend:*
    depends_on:
      db: { condition: service_healthy }
      loader: { condition: service_completed_successfully }
    networks: [internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8001), 3)"]
      interval: 5s
      timeout: 5s
      retries: 30

  # The only container with a route out, and it forwards to exactly one place: LM Studio.
  llm-relay:
    build:
      <<: *build
      dockerfile: relay/Dockerfile
    image: aperture/llm-relay:dev
    environment:
      LLM_UPSTREAM: host.docker.internal:1234
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks: [internal, llm-egress]

  # martin with the snapshot pmtiles baked in.
  tiles:
    build:
      context: .
      network: none
      dockerfile: tiles/Dockerfile
    image: aperture/tiles:dev
    networks: [internal]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/tiles/health"]
      interval: 5s
      timeout: 5s
      retries: 30

  # The edge: SPA + fonts/sprites, reverse proxy to backend, tiles, mcp-server.
  frontend:
    build:
      context: .
      network: none
      dockerfile: frontend/Dockerfile
      args:
        NODE_DEPS: aperture/node-deps:latest
    image: aperture/frontend:dev
    depends_on:
      backend: { condition: service_healthy }
      mcp-server: { condition: service_healthy }
      tiles: { condition: service_healthy }
    networks: [internal, edge]
    # Host port: APERTURE_PORT (default 8080).
    ports: ["127.0.0.1:${APERTURE_PORT:-8080}:8080"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Playwright, on the internal network only:  docker compose run --rm e2e
  e2e:
    build:
      context: .
      network: none
      dockerfile: e2e/Dockerfile
      args:
        E2E_DEPS: aperture/e2e-deps:latest
    image: aperture/e2e:dev
    profiles: [tools]
    environment:
      E2E_BASE_URL: http://frontend:8080
    volumes:
      - ./.verify/phase3/e2e:/out
    shm_size: 1g
    networks: [internal]

  probe:
    image: curlimages/curl@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
    profiles: [tools]
    entrypoint: ["curl"]
    networks: [internal]

  # Throwaway fixtures DB for pytest (host port on loopback only; tmpfs, no volume).
  db-test:
    <<: *db
    profiles: [test]
    tmpfs: ["/home/postgres/pgdata:uid=1000,gid=1000,mode=0700"]
    volumes: *db-init
    ports: ["127.0.0.1:55432:5432"]
    networks: [test]
