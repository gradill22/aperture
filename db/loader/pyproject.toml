[project]
name = "aperture-loader"
version = "0.1.0"
description = "One-shot loader: snapshot parquet/geojsonl -> PostGIS/Timescale"
requires-python = ">=3.14"
dependencies = ["psycopg[binary]", "pyarrow"]

[project.scripts]
aperture-load = "aperture_loader.load:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
