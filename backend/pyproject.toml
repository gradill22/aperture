[project]
name = "aperture-api"
version = "0.1.0"
description = "FastAPI backend: entity, track, replay and geofence queries over PostGIS/Timescale"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy[asyncio]",
    "geoalchemy2",
    "asyncpg",
    "httpx",
    "tzdata",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
