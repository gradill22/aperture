apiVersion: v1
kind: Secret
metadata:
  name: db
  labels:
    {{- include "aperture.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.db.password | quote }}
  DATABASE_URL: {{ printf "postgresql://aperture:%s@db:5432/aperture" .Values.db.password | quote }}
---
# Init SQL, identical to db/init/ (scripts/verify.py phase4 checks the copies match).
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-init
  labels:
    {{- include "aperture.labels" . | nindent 4 }}
data:
  {{- (.Files.Glob "files/db-init/*.sql").AsConfig | nindent 2 }}
---
apiVersion: v1
kind: Service
metadata:
  name: db
  labels:
    {{- include "aperture.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "aperture.selector" (list . "db") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  labels:
    {{- include "aperture.labels" . | nindent 4 }}
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      {{- include "aperture.selector" (list . "db") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aperture.labels" . | nindent 8 }}
        {{- include "aperture.selector" (list . "db") | nindent 8 }}
      annotations:
        checksum/init: {{ (.Files.Glob "files/db-init/*.sql").AsConfig | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "aperture.podSecurity" 1000 | nindent 8 }}
        fsGroup: 1000
      containers:
        - name: postgres
          image: {{ .Values.images.db }}
          imagePullPolicy: Never
          # TimescaleDB phones home by default; telemetry off keeps the DB silent even off-network.
          args: ["postgres", "-c", "timescaledb.telemetry_level=off"]
          env:
            - { name: POSTGRES_USER, value: aperture }
            - { name: POSTGRES_DB, value: aperture }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: db, key: POSTGRES_PASSWORD } }
          ports:
            - { name: postgres, containerPort: 5432 }
          # TCP (not the socket): the init-time server listens on the socket only.
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "aperture", "-d", "aperture", "-h", "127.0.0.1"]
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests: { cpu: 500m, memory: 1Gi }
          securityContext:
            {{- include "aperture.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - { name: pgdata, mountPath: /home/postgres/pgdata }
            - { name: dshm, mountPath: /dev/shm }
            # File by file: the image ships its own init scripts in the same directory.
            {{- range $path, $_ := .Files.Glob "files/db-init/*.sql" }}
            - name: init
              mountPath: /docker-entrypoint-initdb.d/{{ base $path }}
              subPath: {{ base $path }}
              readOnly: true
            {{- end }}
      volumes:
        - name: init
          configMap: { name: db-init }
        - name: dshm
          emptyDir: { medium: Memory, sizeLimit: 1Gi }
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.db.storage }}
