# The single entry point. Static files are local; the only upstreams are services on the
# internal network. There is deliberately no `resolver`: names resolve once, at startup.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 1m;
    gzip on;
    gzip_types application/json application/javascript text/css application/x-protobuf image/svg+xml;

    # The browser may talk to this origin and nothing else.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; child-src blob:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location / {
        try_files $uri /index.html;
    }

    location /assets/ {
        expires 1y;
    }

    location /fonts/ {
        default_type application/x-protobuf;
        expires 30d;
    }

    location /sprites/ {
        expires 30d;
    }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        # /api/chat waits on the local LLM (tens of seconds per tool round).
        proxy_read_timeout 300s;
    }

    location /tiles/ {
        proxy_pass http://tiles:3000;
        proxy_http_version 1.1;
    }

    # MCP (streamable HTTP) for local agent clients: http://localhost:8090/mcp (host port)
    location = /mcp {
        proxy_pass http://mcp-server:8001/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
