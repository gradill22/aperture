[project]
name = "aperture"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["aperture-data"]

[tool.uv.sources]
aperture-data = { workspace = true }

[tool.uv.workspace]
members = ["data"]

[dependency-groups]
dev = ["ruff", "pytest"]

[tool.ruff]
line-length = 100
target-version = "py314"
